<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner Menu & Groceries</title>
  <meta name="theme-color" content="#d97706">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Dinner%20Menu%22%2C%22short_name%22%3A%22Menu%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23d97706%22%7D">
  <style>
    :root {
      --primary: #d97706;
      --primary-dark: #b45309;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --active: #fef3c7;
      --danger: #ef4444;
      --prep-bg: #f0fdf4;
      --prep-border: #86efac;
      --prep-text: #166534;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem 1rem 5rem 1rem;
      max-width: 500px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 0.5rem 0 1rem 0;
    }
    h1 { font-size: 1.4rem; color: var(--primary); }
    .week-indicator { font-weight: 600; color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem; }
    
    .nav-weeks {
      display: flex;
      gap: 0.4rem;
      margin: 0.75rem 0 1.25rem 0;
      justify-content: center;
    }
    .week-btn {
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .week-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Weekend Lunch Prep Card */
    .prep-card {
      background: var(--prep-bg);
      border: 1.5px solid var(--prep-border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.75rem;
    }
    .prep-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--prep-text);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .prep-options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }
    .prep-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: white;
      border: 1px solid var(--prep-border);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .prep-chip input {
      accent-color: #16a34a;
      cursor: pointer;
    }
    .prep-chip.selected {
      background: #dcfce7;
      border-color: #22c55e;
      font-weight: 600;
      color: #14532d;
    }
    
    /* Dessert Card */
    .dessert-card {
      background: #fffbeb;
      border: 1.5px dashed #f59e0b;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
    }
    .dessert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #92400e;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .dessert-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .dessert-select, .dessert-input {
      padding: 0.4rem 0.6rem;
      border: 1px solid #fcd34d;
      border-radius: 6px;
      background: #ffffff;
      font-size: 0.85rem;
      color: var(--text);
    }
    .dessert-select { flex: 1; }
    .dessert-input { flex: 1; min-width: 140px; }

    /* Day Card */
    .day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .day-card.today {
      border: 2px solid var(--primary);
      background: var(--active);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge {
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }
    .badge-cook { background: #fee2e2; color: #b91c1c; }
    .badge-leftover { background: #e0f2fe; color: #0369a1; }
    .badge-out { background: #fef08a; color: #854d0e; }

    .dish-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }
    .dish-sides {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .dish-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.35rem;
    }
    .btn-swap {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-swap:hover {
      background: #fff7ed;
      border-color: var(--primary);
    }

    /* Modal for Swapping */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 1.25rem;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .modal-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .swap-option {
      padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.4rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .swap-option:hover {
      background: var(--active);
      border-color: var(--primary);
    }
    .swap-option strong { display: block; color: var(--primary-dark); }
    .modal-close {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.5rem;
      background: var(--border);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Grocery Styles & Form */
    .grocery-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: var(--card);
      padding: 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .grocery-form input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .grocery-form button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .grocery-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .grocery-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
    }
    .grocery-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0;
      font-size: 0.95rem;
    }
    .grocery-item-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
      flex: 1;
    }
    .grocery-item input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .grocery-item.checked span {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .delete-item-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 0.4rem;
    }
    .grocery-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 0.6rem 0;
      max-width: 500px;
      margin: 0 auto;
      z-index: 100;
    }
    .nav-tab {
      background: none;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }
    .nav-tab.active {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="view-title">Weekly Dinner Menu</h1>
    <div class="week-indicator" id="current-cycle">Loading schedule...</div>
  </header>

  <div class="nav-weeks">
    <button class="week-btn" onclick="selectWeek(1)">Week 1</button>
    <button class="week-btn" onclick="selectWeek(2)">Week 2</button>
    <button class="week-btn" onclick="selectWeek(3)">Week 3</button>
    <button class="week-btn" onclick="selectWeek(4)">Week 4</button>
  </div>

  <!-- Menu View -->
  <div id="schedule-container">
    <div class="prep-card" id="prep-card-container"></div>
    <div class="dessert-card" id="dessert-card-container"></div>
    <div id="days-container"></div>
  </div>

  <!-- Grocery View -->
  <div id="grocery-container" style="display: none;">
    <form class="grocery-form" onsubmit="handleAddGroceryItem(event)">
      <input type="text" id="custom-grocery-input" placeholder="Add extra grocery item..." required />
      <button type="submit">Add</button>
    </form>
    <div class="grocery-actions">
      <span style="font-size:0.8rem; color:var(--text-muted);" id="grocery-week-indicator"></span>
      <button class="reset-btn" onclick="resetCheckedItems()">Clear Checked Items</button>
    </div>
    <div id="grocery-list-content"></div>
  </div>

  <!-- Swap Modal -->
  <div class="modal-overlay" id="swap-modal">
    <div class="modal">
      <h3 id="modal-title">Swap Dish</h3>
      <p class="modal-subtitle">Pick another scheduled fresh dish from Weeks 1–4 to swap with:</p>
      <div id="swap-options-list"></div>
      <button class="modal-close" onclick="closeSwapModal()">Cancel</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-tab active" id="tab-menu" onclick="switchView('menu')">
      🍽️ Menu
    </button>
    <button class="nav-tab" id="tab-grocery" onclick="switchView('grocery')">
      🛒 Grocery List
    </button>
  </nav>

  <script>
    const defaultMenuData = {
      1: {
        sat: { dish: "Chicken Pulao", sides: "Served with Raita", cook: true },
        mon: { dish: "Desi-Style Chicken Pasta", sides: "Spicy stir-fry macaroni", cook: true },
        wed: { dish: "Yellow Dal Tadka", sides: "Served with Steamed Rice or Roti", cook: true },
        groceries: {
          produce: ["Onions (1 kg)", "Tomatoes (500g)", "Ginger & Garlic paste", "Green Chilies", "Cilantro (Dhaniya)", "Cucumber & Mint (for Raita)", "Bell Peppers (Capsicum)"],
          meat: ["Bone-in Chicken (1 kg - for Pulao)", "Boneless Chicken Breast (500g - diced for Pasta)"],
          spices: ["Basmati Rice", "Macaroni / Penne Pasta", "Yellow Lentils (Moong / Masoor Dal)", "Whole Garam Masala (Cumin, Cloves, Cardamom)", "Chili Flakes & Chaat Masala", "Yogurt (Dahi)"]
        }
      },
      2: {
        sat: { dish: "Chicken Karahi", sides: "Served with Naan or Roti", cook: true },
        mon: { dish: "Chicken Chow Mein", sides: "Pakistani-style spicy Chinese noodles", cook: true },
        wed: { dish: "Bhindi Masala (Okra)", sides: "Served with hot Phulkas/Roti", cook: true },
        groceries: {
          produce: ["Fresh Okra / Bhindi (750g)", "Tomatoes (1 kg)", "Onions (1 kg)", "Cabbage", "Carrots", "Bell Peppers", "Spring Onions", "Ginger (julienned)"],
          meat: ["Karahi-cut Chicken (1 kg)", "Boneless Chicken Strips (400g)"],
          spices: ["Egg Noodles or Spaghetti", "Soy Sauce, Chili Sauce & Vinegar", "Crushed Red Pepper & Black Pepper", "Karahi Masala / Crushed Coriander & Cumin", "Cooking Oil / Ghee"]
        }
      },
      3: {
        sat: { dish: "Chicken or Meat Biryani", sides: "Monthly special treat + Raita", cook: true },
        mon: { dish: "Indo-Pak Chili Chicken", sides: "Served with Egg Fried Rice", cook: true },
        wed: { dish: "Baingan Ka Salan (Eggplant)", sides: "Served with Roti", cook: true },
        groceries: {
          produce: ["Eggplants / Baingan (500g)", "Onions (1.5 kg)", "Tomatoes (750g)", "Green Chilies & Fresh Mint", "Garlic cloves", "Spring Onions"],
          meat: ["Biryani-cut Chicken or Mutton (1 kg)", "Boneless Chicken Cubes (500g)"],
          spices: ["Aged Sella or Basmati Rice", "Eggs (for Fried Rice)", "Biryani Masala & Kewra Water", "Cornflour / Cornstarch", "Soy Sauce & Hot Sauce", "Mustard seeds / Fenugreek seeds (for Salan)", "Yogurt (500g)"]
        }
      },
      4: {
        sat: { dish: "Chicken Salan (Shorba)", sides: "Homestyle chicken curry + Roti", cook: true },
        mon: { dish: "Baked Pakistani Chicken Pasta", sides: "Cheesy or white-sauce desi style", cook: true },
        wed: { dish: "Mixed / Kaali Dal", sides: "Served with Steamed Rice & Pickles", cook: true },
        groceries: {
          produce: ["Potatoes (optional for Salan)", "Onions (1 kg)", "Tomatoes (500g)", "Cilantro & Green Chilies", "Garlic & Ginger"],
          meat: ["Curry-cut Chicken (1 kg)", "Boneless Shredded Chicken (400g)"],
          spices: ["Urad Dal / Mixed Dal", "Pasta (Penne or Elbow)", "Milk, Butter & All-Purpose Flour", "Shredded Mozzarella / Cheddar", "Turmeric, Red Chili Powder & Coriander Powder", "Basmati Rice"]
        }
      }
    };

    // Ingredient recipes for school meal prep
    const mealPrepLibrary = {
      "spring rolls": {
        name: "Spring Rolls",
        groceries: ["Spring roll sheets / pastry wrappers", "Shredded cabbage & carrots", "Shredded chicken or minced filling", "Soy sauce & white pepper"]
      },
      "samosa": {
        name: "Samosa",
        groceries: ["Samosa patti / pastry dough", "Potatoes (aloo) or minced meat (qeema)", "Cumin seeds & Chaat masala", "Fresh coriander & green peas"]
      },
      "mini pizza": {
        name: "Mini Pizza",
        groceries: ["Mini pizza bases or dough flour", "Pizza sauce", "Shredded mozzarella cheese", "Pizza toppings (chicken chunks, olives, sweetcorn)"]
      },
      "chicken bread": {
        name: "Chicken Bread",
        groceries: ["All-purpose flour (maida) & yeast", "Shredded cooked chicken", "Milk, butter & egg (for wash)", "Sesame seeds (til)"]
      },
      "cookies": {
        name: "Cookies",
        groceries: ["Butter & brown sugar", "Chocolate chips", "Vanilla extract", "Baking powder & flour"]
      },
      "brownies": {
        name: "Brownies",
        groceries: ["Dark chocolate / Cocoa powder", "Butter & eggs", "Granulated sugar", "Flour"]
      },
      "chocolate balls": {
        name: "Chocolate Balls",
        groceries: ["Marie / digestive biscuits", "Condensed milk", "Cocoa powder", "Sprinkles or desiccated coconut"]
      }
    };

    function getMenuData() {
      const stored = localStorage.getItem('monthly_menu_data');
      if (stored) {
        try { return JSON.parse(stored); } catch (e) { }
      }
      return JSON.parse(JSON.stringify(defaultMenuData));
    }

    function saveMenuData(data) {
      localStorage.setItem('monthly_menu_data', JSON.stringify(data));
    }

    let currentMenuData = getMenuData();

    function getCurrentWeek() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 1);
      const days = Math.floor((now - start) / (24 * 60 * 60 * 1000));
      const weekNumber = Math.ceil((days + start.getDay() + 1) / 7);
      return ((weekNumber - 1) % 4) + 1;
    }

    let activeWeek = getCurrentWeek();
    let currentView = 'menu';
    const todayIndex = new Date().getDay();

    function selectWeek(weekNum) {
      activeWeek = weekNum;
      updateHeader();
      if (currentView === 'menu') {
        renderMenu();
      } else {
        renderGroceries();
      }
    }

    function updateHeader() {
      document.querySelectorAll('.week-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === activeWeek);
      });
      const currentAutoWeek = getCurrentWeek();
      document.getElementById('current-cycle').innerText = 
        activeWeek === currentAutoWeek ? `Week ${activeWeek} (Current Active Cycle)` : `Viewing Week ${activeWeek}`;
      document.getElementById('grocery-week-indicator').innerText = `Week ${activeWeek} Grocery List`;
    }

    /* Weekend Meal Prep Functions */
    function getSelectedMealPrep(weekNum) {
      const saved = localStorage.getItem(`meal_prep_week_${weekNum}`);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) {}
      }
      return [];
    }

    function toggleMealPrepOption(weekNum, key) {
      let selected = getSelectedMealPrep(weekNum);
      if (selected.includes(key)) {
        selected = selected.filter(item => item !== key);
      } else {
        selected.push(key);
      }
      localStorage.setItem(`meal_prep_week_${weekNum}`, JSON.stringify(selected));
      renderPrepCard();
    }

    function renderPrepCard() {
      const selected = getSelectedMealPrep(activeWeek);
      const options = Object.keys(mealPrepLibrary);

      const chipsHtml = options.map(key => {
        const isChecked = selected.includes(key);
        const item = mealPrepLibrary[key];
        return `
          <label class="prep-chip ${isChecked ? 'selected' : ''}">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleMealPrepOption(${activeWeek}, '${key}')">
            <span>${item.name}</span>
          </label>
        `;
      }).join('');

      const html = `
        <div class="prep-header">
          <span>🎒 School Lunch Prep (Weekend)</span>
          <span style="font-size:0.75rem; font-weight: normal; color: var(--prep-text);">Multiple Choice</span>
        </div>
        <div class="prep-options-grid">
          ${chipsHtml}
        </div>
      `;
      document.getElementById('prep-card-container').innerHTML = html;
    }

    /* Dessert Functions */
    function getDessert(weekNum) {
      const saved = localStorage.getItem(`dessert_week_${weekNum}`);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) {}
      }
      return { choice: "Fruit Trifle", custom: "" };
    }

    function setDessertChoice(weekNum, choice) {
      const current = getDessert(weekNum);
      current.choice = choice;
      localStorage.setItem(`dessert_week_${weekNum}`, JSON.stringify(current));
      renderDessertCard();
    }

    function setDessertCustomText(weekNum, text) {
      const current = getDessert(weekNum);
      current.custom = text;
      localStorage.setItem(`dessert_week_${weekNum}`, JSON.stringify(current));
    }

    function renderDessertCard() {
      const dessert = getDessert(activeWeek);
      const options = ["Fruit Trifle", "Cake", "Vermicelli", "Cookies", "Other"];
      const isOther = dessert.choice === "Other";

      const html = `
        <div class="dessert-header">
          <span>🍰 Weekly Dessert Treat</span>
          <span style="font-size:0.75rem; font-weight: normal; color: #b45309;">1x per week</span>
        </div>
        <div class="dessert-controls">
          <select class="dessert-select" onchange="setDessertChoice(${activeWeek}, this.value)">
            ${options.map(opt => `<option value="${opt}" ${dessert.choice === opt ? 'selected' : ''}>${opt}</option>`).join('')}
          </select>
          ${isOther ? `<input type="text" class="dessert-input" placeholder="Enter dessert name..." value="${dessert.custom || ''}" oninput="setDessertCustomText(${activeWeek}, this.value)" />` : ''}
        </div>
      `;
      document.getElementById('dessert-card-container').innerHTML = html;
    }

    /* Menu & Day Rendering */
    function renderMenu() {
      renderPrepCard();
      renderDessertCard();
      const currentAutoWeek = getCurrentWeek();
      const week = currentMenuData[activeWeek];
      const days = [
        { name: "Saturday", dayKey: "sat", dayId: 6, ...week.sat, type: "cook" },
        { name: "Sunday", dayKey: "sun", dayId: 0, dish: `${week.sat.dish} (Leftovers)`, sides: week.sat.sides, type: "leftover" },
        { name: "Monday", dayKey: "mon", dayId: 1, ...week.mon, type: "cook" },
        { name: "Tuesday", dayKey: "tue", dayId: 2, dish: `${week.mon.dish} (Leftovers)`, sides: week.mon.sides, type: "leftover" },
        { name: "Wednesday", dayKey: "wed", dayId: 3, ...week.wed, type: "cook" },
        { name: "Thursday", dayKey: "thu", dayId: 4, dish: `${week.wed.dish} (Leftovers)`, sides: week.wed.sides, type: "leftover" },
        { name: "Friday", dayKey: "fri", dayId: 5, dish: "Dining Out / Takeout 🍕", sides: "Kitchen closed! No cooking or dishes.", type: "out" }
      ];

      const container = document.getElementById('days-container');
      container.innerHTML = days.map(d => {
        const isToday = (activeWeek === currentAutoWeek && d.dayId === todayIndex);
        let badgeLabel = d.type === "cook" ? "Cook Fresh" : (d.type === "leftover" ? "Leftovers" : "Eat Out");
        let badgeClass = `badge-${d.type}`;
        let swapAction = d.type === "cook" 
          ? `<div class="dish-footer"><button class="btn-swap" onclick="openSwapModal(${activeWeek}, '${d.dayKey}')">⇄ Swap with another day</button></div>` 
          : '';

        return `
          <div class="day-card ${isToday ? 'today' : ''}">
            <div class="day-header">
              <span>${d.name} ${isToday ? '• TODAY' : ''}</span>
              <span class="badge ${badgeClass}">${badgeLabel}</span>
            </div>
            <div class="dish-name">${d.dish}</div>
            <div class="dish-sides">${d.sides}</div>
            ${swapAction}
          </div>
        `;
      }).join('');
    }

    /* Swap Modal Logic */
    let swapSource = null;

    function openSwapModal(weekNum, dayKey) {
      swapSource = { week: weekNum, day: dayKey };
      const currentDish = currentMenuData[weekNum][dayKey].dish;
      const dayNames = { sat: "Saturday", mon: "Monday", wed: "Wednesday" };
      
      document.getElementById('modal-title').innerText = `Swap ${dayNames[dayKey]} (W${weekNum}): ${currentDish}`;

      const optionsList = document.getElementById('swap-options-list');
      let html = '';

      for (let w = 1; w <= 4; w++) {
        ['sat', 'mon', 'wed'].forEach(day => {
          if (w === weekNum && day === dayKey) return;
          const targetDish = currentMenuData[w][day];
          html += `
            <div class="swap-option" onclick="executeSwap(${w}, '${day}')">
              <strong>Week ${w} • ${dayNames[day]}</strong>
              ${targetDish.dish} <span style="font-size:0.75rem; color:var(--text-muted);">(${targetDish.sides})</span>
            </div>
          `;
        });
      }

      optionsList.innerHTML = html;
      document.getElementById('swap-modal').style.display = 'flex';
    }

    function closeSwapModal() {
      document.getElementById('swap-modal').style.display = 'none';
      swapSource = null;
    }

    function executeSwap(targetWeek, targetDay) {
      if (!swapSource) return;

      const sourceMeal = { ...currentMenuData[swapSource.week][swapSource.day] };
      const targetMeal = { ...currentMenuData[targetWeek][targetDay] };

      currentMenuData[swapSource.week][swapSource.day] = targetMeal;
      currentMenuData[targetWeek][targetDay] = sourceMeal;

      saveMenuData(currentMenuData);
      closeSwapModal();
      renderMenu();
    }

    /* Grocery List & Custom Items */
    function getCustomGroceries(weekNum) {
      const key = `custom_groceries_w${weekNum}`;
      const saved = localStorage.getItem(key);
      return saved ? JSON.parse(saved) : [];
    }

    function saveCustomGroceries(weekNum, items) {
      localStorage.setItem(`custom_groceries_w${weekNum}`, JSON.stringify(items));
    }

    function handleAddGroceryItem(e) {
      e.preventDefault();
      const input = document.getElementById('custom-grocery-input');
      const text = input.value.trim();
      if (!text) return;

      const list = getCustomGroceries(activeWeek);
      list.push({ text: text, checked: false });
      saveCustomGroceries(activeWeek, list);

      input.value = '';
      renderGroceries();
    }

    function toggleCustomGroceryItem(weekNum, idx) {
      const list = getCustomGroceries(weekNum);
      if (list[idx]) {
        list[idx].checked = !list[idx].checked;
        saveCustomGroceries(weekNum, list);
        renderGroceries();
      }
    }

    function deleteCustomGroceryItem(weekNum, idx) {
      const list = getCustomGroceries(weekNum);
      list.splice(idx, 1);
      saveCustomGroceries(weekNum, list);
      renderGroceries();
    }

    function getStorageKey(weekNum, category, index) {
      return `grocery_w${weekNum}_${category}_${index}`;
    }

    function toggleGroceryItem(weekNum, category, index) {
      const key = getStorageKey(weekNum, category, index);
      const isChecked = localStorage.getItem(key) === 'true';
      localStorage.setItem(key, (!isChecked).toString());
      renderGroceries();
    }

    function togglePrepGroceryItem(weekNum, itemText) {
      const key = `grocery_prep_w${weekNum}_${itemText}`;
      const isChecked = localStorage.getItem(key) === 'true';
      localStorage.setItem(key, (!isChecked).toString());
      renderGroceries();
    }

    function resetCheckedItems() {
      // Clear preset checked status
      const weekGroceries = defaultMenuData[activeWeek].groceries;
      ['produce', 'meat', 'spices'].forEach(cat => {
        weekGroceries[cat].forEach((_, idx) => {
          localStorage.removeItem(getStorageKey(activeWeek, cat, idx));
        });
      });
      // Clear meal prep checked items
      const selectedPreps = getSelectedMealPrep(activeWeek);
      selectedPreps.forEach(key => {
        mealPrepLibrary[key].groceries.forEach(item => {
          localStorage.removeItem(`grocery_prep_w${activeWeek}_${item}`);
        });
      });
      // Clear custom checked items
      const custom = getCustomGroceries(activeWeek);
      custom.forEach(item => item.checked = false);
      saveCustomGroceries(activeWeek, custom);

      renderGroceries();
    }

    function renderGroceries() {
      let content = '';

      // Meal Prep Groceries Section (if any selected)
      const selectedPreps = getSelectedMealPrep(activeWeek);
      if (selectedPreps.length > 0) {
        // Collect all prep groceries (avoiding duplicate names if multiple selected)
        const prepGroceries = [];
        selectedPreps.forEach(key => {
          mealPrepLibrary[key].groceries.forEach(item => {
            if (!prepGroceries.includes(item)) prepGroceries.push(item);
          });
        });

        const prepItemsHtml = prepGroceries.map(item => {
          const key = `grocery_prep_w${activeWeek}_${item}`;
          const checked = localStorage.getItem(key) === 'true';
          return `
            <div class="grocery-item ${checked ? 'checked' : ''}">
              <label class="grocery-item-left">
                <input type="checkbox" ${checked ? 'checked' : ''} onchange="togglePrepGroceryItem(${activeWeek}, '${item.replace(/'/g, "\\'")}')">
                <span>${item}</span>
              </label>
            </div>
          `;
        }).join('');

        content += `
          <div class="grocery-section" style="border-left: 4px solid #22c55e;">
            <div class="grocery-section-title" style="color: #166534;">🥪 Lunch Prep Groceries</div>
            ${prepItemsHtml}
          </div>
        `;
      }

      // Default Menu Groceries
      const groceries = defaultMenuData[activeWeek].groceries;
      const categories = [
        { key: 'produce', title: '🥬 Fresh Produce' },
        { key: 'meat', title: '🍗 Meat & Poultry' },
        { key: 'spices', title: '🧂 Spices, Grains & Pantry' }
      ];

      content += categories.map(cat => {
        const items = groceries[cat.key].map((item, idx) => {
          const checked = localStorage.getItem(getStorageKey(activeWeek, cat.key, idx)) === 'true';
          return `
            <div class="grocery-item ${checked ? 'checked' : ''}">
              <label class="grocery-item-left">
                <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleGroceryItem(${activeWeek}, '${cat.key}', ${idx})">
                <span>${item}</span>
              </label>
            </div>
          `;
        }).join('');

        return `
          <div class="grocery-section">
            <div class="grocery-section-title">${cat.title}</div>
            ${items}
          </div>
        `;
      }).join('');

      // Custom Added Items Section
      const customItems = getCustomGroceries(activeWeek);
      if (customItems.length > 0) {
        const customHtml = customItems.map((item, idx) => `
          <div class="grocery-item ${item.checked ? 'checked' : ''}">
            <label class="grocery-item-left">
              <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCustomGroceryItem(${activeWeek}, ${idx})">
              <span>${item.text}</span>
            </label>
            <button class="delete-item-btn" title="Delete" onclick="deleteCustomGroceryItem(${activeWeek}, ${idx})">&times;</button>
          </div>
        `).join('');

        content += `
          <div class="grocery-section">
            <div class="grocery-section-title">✨ Added Extras (Week ${activeWeek})</div>
            ${customHtml}
          </div>
        `;
      }

      document.getElementById('grocery-list-content').innerHTML = content;
    }

    function switchView(view) {
      currentView = view;
      const isMenu = view === 'menu';
      document.getElementById('schedule-container').style.display = isMenu ? 'block' : 'none';
      document.getElementById('grocery-container').style.display = isMenu ? 'none' : 'block';
      document.getElementById('tab-menu').classList.toggle('active', isMenu);
      document.getElementById('tab-grocery').classList.toggle('active', !isMenu);
      document.getElementById('view-title').innerText = isMenu ? 'Weekly Dinner Menu' : 'Weekly Grocery List';

      if (isMenu) {
        renderMenu();
      } else {
        renderGroceries();
      }
    }

    // Initialize
    updateHeader();
    renderMenu();
  </script>
</body>
</html>
